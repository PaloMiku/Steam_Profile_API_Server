name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 同一分支的新 push 会取消仍在跑的旧 run，避免浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须先于 setup-node 安装：setup-node 的 pnpm 缓存依赖 pnpm store
      # 不写 version：action 会自动读取 package.json 的 packageManager 字段，
      # 本地与 CI 保持同一版本（pnpm-workspace.yaml 的 allowBuilds 依赖 pnpm 11 语法）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
